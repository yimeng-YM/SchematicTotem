                .replace('Block.shouldDrawSide(self, other, side)', '!self.isSideInvisible(other, side) && (!other.isOpaque() || net.minecraft.util.shape.VoxelShapes.matchesAnywhere(self.getCullingFace(EmptyBlockView.INSTANCE, BlockPos.ORIGIN, side), other.getCullingFace(EmptyBlockView.INSTANCE, BlockPos.ORIGIN, side.getOpposite()), net.minecraft.util.function.BooleanBiFunction.ONLY_FIRST))')
