                .replace('SpecialGuiElementRegistry', 'PictureInPictureRendererRegistry')
                .replace('new MiniaturePreviewRenderer(context.vertexConsumers())', 'new MiniaturePreviewRenderer()')
                .replace('net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper', 'net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper')
                .replace('KeyBindingHelper.registerKeyBinding(', 'KeyMappingHelper.registerKeyMapping(')
        if (!path.contains('/compat/') && !path.endsWith('/StubBlockModels.java')) {
            text = text.replace('import net.minecraft.client.renderer.block.model.BakedQuad;', 'import dev.yimeng.schematictotem.compat.CompatQuad;')
