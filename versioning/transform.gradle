                .replace('.getOrEmpty(identifier)', '.getOptionalValue(identifier)')
                .replace('biomes.getOrEmpty(', 'biomes.getOptionalValue(')
                .replace('getRegistryManager().get(', 'getRegistryManager().getOrThrow(')
                .replace('Registries.BLOCK.getReadOnlyWrapper()', 'Registries.BLOCK')
                .replace('self.getCullingFace(EmptyBlockView.INSTANCE, BlockPos.ORIGIN, side)', 'self.getCullingFace(side)')
                .replace('other.getCullingFace(EmptyBlockView.INSTANCE, BlockPos.ORIGIN, side.getOpposite())', 'other.getCullingFace(side.getOpposite())')
                .replace('.asRotation()', '.getPositiveHorizontalDegrees()')
                .replace('client.currentScreen.filesDragged(rest)', 'client.currentScreen.onFilesDropped(rest)')
    }
    if (path.endsWith('/StubBlockModels.java')) {
        text = text.replace('import net.minecraft.client.render.model.BlockStateModel;', 'import dev.yimeng.schematictotem.compat.CompatBlockModels.Model;')
                .replace('BlockStateModel', 'Model')
    }
    if (path.endsWith('/Mesh.java')) {
        text = text.replace('pose.transformNormal(d.getFloatVector(), n);', 'n.set(d.getOffsetX(), d.getOffsetY(), d.getOffsetZ()).mul(pose.getNormalMatrix()).normalize();')
                .replace('LightmapTextureManager.applyEmission(light, e)', 'Math.max(light & 0xffff, e << 4) | (light & 0xffff0000)')
    }
    if (path.endsWith('/mixin/MouseMixin.java') && !before('1.21')) {
        text = text.replace('List<Path> paths, CallbackInfo ci)', 'List<Path> paths, int invalidFilesCount, CallbackInfo ci)')
                .replace('        ci.cancel();', '        ci.cancel();\n        if (invalidFilesCount > 0) net.minecraft.client.toast.SystemToast.addFileDropFailure(client, invalidFilesCount);')
    }
    if (path.endsWith('/SchematicReader.java') && !before('1.20.2') && before('1.21.5')) {
        text = text.replace('return NbtIo.read(new DataInputStream(raw),', 'return NbtIo.readCompound(new DataInputStream(raw),')
        if (before('1.20.4')) text = text.replace('NbtSizeTracker', 'NbtTagSizeTracker')
        if (before('1.20.3')) {
            text = text
                    .replace('NbtIo.readCompressed(raw, NbtTagSizeTracker.of(NBT_LIMIT))', 'NbtIo.readCompound(new DataInputStream(new java.util.zip.GZIPInputStream(raw)), NbtTagSizeTracker.of(NBT_LIMIT))')
        }
    }
    if (!before('1.21.5')) {
        text = text.replace('ModelTransformationMode', 'ItemDisplayContext')
                .replace('new HoverEvent(HoverEvent.Action.SHOW_TEXT, ', 'new HoverEvent.ShowText(')
                .replace('new ClickEvent(ClickEvent.Action.RUN_COMMAND, ', 'new ClickEvent.RunCommand(')
                .replace('quad.getVertexData()', 'quad.vertexData()')
                .replace('quad.getTintIndex()', 'quad.tintIndex()')
                .replace('quad.getFace()', 'quad.face()')
                .replace('quad.getSprite()', 'quad.sprite()')
                .replace('quad.hasShade()', 'quad.shade()')
                .replace('RenderSystem.enableDepthTest();', '')
        if (path.endsWith('/Miniature.java')) {
            text = text.replace('public final Vector3fc[] cornerArray;', 'public final Vector3fc[] cornerArray;\n    public final java.util.function.Supplier<org.joml.Vector3f[]> legacyCorners;')
                    .replace('this.cornerArray = corners;', 'this.cornerArray = corners;\n        org.joml.Vector3f[] legacy = java.util.Arrays.stream(corners).map(org.joml.Vector3f::new).toArray(org.joml.Vector3f[]::new);\n        this.legacyCorners = () -> legacy;')
        }
    }
    if (before('1.21.6')) text = text.replace('getGameVersion().dataVersion().id()', 'getGameVersion().getSaveVersion().getId()')
    if (!before('1.21.6')) text = text.replace('layer.setVector(', 'layer.setVertices(')
    if (!before('1.21.6') && path.endsWith('/MiniatureBaker.java')) {
        text = text.replace('RenderLayer.getTranslucent()', 'net.minecraft.client.render.BlockRenderLayer.TRANSLUCENT')
    }
    if (!before('1.21.9')) {
        text = text.replace('holder.getPos()', 'holder.getEntityPos()')
        if (path.endsWith('/MiniatureMeshRenderer.java') || path.endsWith('/BlockEntityPartsRenderer.java')) {
            text = text.replace('collectVertices(Consumer<Vector3fc> consumer)', 'collectVertices(java.util.Set<org.joml.Vector3f> vertices)')
                    .replace('getBlockEntityModelsSupplier();', 'getBlockEntityModelsSupplier().get();')
        }
        if (path.endsWith('/ItemModelManagerMixin.java')) {
            text = text.replace('Lnet/minecraft/entity/LivingEntity;I)V', 'Lnet/minecraft/util/HeldItemContext;I)V')
                    .replace('LivingEntity owner, int seed', 'net.minecraft.util.HeldItemContext owner, int seed')
                    .replace('tryRender(state, stack, context, owner)', 'tryRender(state, stack, context, owner == null ? null : owner.getEntity())')
        }
    }
    if (!before('1.21.9')) text = text.replace('context.drawBorder(', 'context.drawStrokedRectangle(')
    if (before('1.21.4')) {
        text = text.replace('quad.getTintIndex()', 'quad.getColorIndex()')
                .replace('.getPositiveHorizontalDegrees()', '.asRotation()')
                .replace('client.currentScreen.onFilesDropped(rest)', 'client.currentScreen.filesDragged(rest)')
    }
    if (path.endsWith('/SchematicPipelineTest.java') && before('1.21.5')) {
        text = text.replace('.getCompoundOrEmpty(', '.getCompound(')
                .replace('root.getCompound("Metadata").getInt("TotalBlocks", -1)', 'dev.yimeng.schematictotem.compat.CompatNbt.integer(root.getCompound("Metadata"), "TotalBlocks", -1)')
        if (before('1.20.3')) {
            text = text.replace('import net.minecraft.nbt.NbtSizeTracker;', '')
                    .replace('NbtIo.readCompressed(file, NbtSizeTracker.ofUnlimitedBytes())', 'NbtIo.readCompressed(file.toFile())')
        } else if (before('1.20.4')) text = text.replace('NbtSizeTracker', 'NbtTagSizeTracker')
    }
    return text
}
