                    .replace('for (CompatQuad quad : part.getQuads(DIRS[d]))', 'for (CompatQuad quad : CompatQuad.wrap(part.getQuads(DIRS[d])))')
                    .replace('for (CompatQuad quad : part.getQuads(null))', 'for (CompatQuad quad : CompatQuad.wrap(part.getQuads(null)))')
                    .replace('net.fabricmc.fabric.api.client.render.fluid.v1.FluidRenderHandlerRegistry', 'dev.yimeng.schematictotem.compat.CompatFluidRenderHandlerRegistry')
                    .replace('net.fabricmc.fabric.api.client.render.fluid.v1.FluidRenderHandler', 'dev.yimeng.schematictotem.compat.CompatFluidRenderHandler')
                    .replace('FluidRenderHandlerRegistry.INSTANCE', 'CompatFluidRenderHandlerRegistry.INSTANCE')
                    .replace('FluidRenderHandler handler', 'CompatFluidRenderHandler handler')
        }
        if (path.endsWith('/Miniature.java')) {
            text = text.replace('colors.getColor(key.state(), view, pos, key.tintIndex())', 'view == null ? colors.getTintSource(key.state(), key.tintIndex()).color(key.state()) : colors.getTintSource(key.state(), key.tintIndex()).colorInWorld(key.state(), view, pos)')
