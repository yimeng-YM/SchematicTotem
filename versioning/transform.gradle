                .replace('.getCameraPos()', '.getPos()')
                .replace('getRegistryManager().getOrThrow(', 'getRegistryManager().get(')
                .replace('.getOptionalValue(', '.getOrEmpty(')
                .replace('Util.getOperatingSystem().open(dir)', 'Util.getOperatingSystem().open(dir.toFile())')
                .replace('new HoverEvent.ShowText(', 'new HoverEvent(HoverEvent.Action.SHOW_TEXT, ')
                .replace('new ClickEvent.RunCommand(', 'new ClickEvent(ClickEvent.Action.RUN_COMMAND, ')
                .replace('NbtHelper.toBlockState(Registries.BLOCK, input)', 'NbtHelper.toBlockState(Registries.BLOCK.getReadOnlyWrapper(), input)')
                .replace('box.getLengthX()', '(box.maxX - box.minX)').replace('box.getLengthY()', '(box.maxY - box.minY)').replace('box.getLengthZ()', '(box.maxZ - box.minZ)')
                .replace('still.getFrameU(', 'PackedUv.u(still, ').replace('still.getFrameV(', 'PackedUv.v(still, ')
                .replace('flowing.getFrameU(', 'PackedUv.u(flowing, ').replace('flowing.getFrameV(', 'PackedUv.v(flowing, ')
