                    .replace('Minecraft.getInstance().gui.setScreen(', 'Minecraft.getInstance().setScreen(')
                    .replace('client.gameRenderer.mainCamera()', 'client.gameRenderer.getMainCamera()')
        }
        return text
    }
    if (!before('1.21.11')) return text
    if (before('1.21.6') && (path.endsWith('/TotemConfigScreen.java') || path.endsWith('/FilePickerScreen.java'))) {
