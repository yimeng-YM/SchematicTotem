                    .replace('        if (previewMode == PreviewMode.POP) {', '''        if (minecraft.level == null) {
            TotemModels.INSTANCE.renderPreview(previewState, previewMode == PreviewMode.POP ? ItemDisplayContext.FIXED : previewMode.context);
        } else {
        if (totem.isEmpty()) totem = new ItemStack(Items.TOTEM_OF_UNDYING);
        if (previewMode == PreviewMode.POP) {''')
                    .replace('        if (previewState.isEmpty()) return;', '        }\n        if (previewState.isEmpty()) return;')
        }
        if (targetMinecraft.startsWith('26.1') && path.endsWith('/SchematicTotemClient.java')) {
