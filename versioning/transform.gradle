ext.transformVersionSource = { String path, String text ->
    def number = { String version -> version.tokenize('.').collect { it as int } }
    def before = { String version ->
        def left = number(targetMinecraft), right = number(version)
        for (int i = 0; i < Math.max(left.size(), right.size()); i++) {
            int a = i < left.size() ? left[i] : 0, b = i < right.size() ? right[i] : 0
            if (a != b) return a < b
        }
        return false
    }
    if (path.endsWith('/SchematicPipelineTest.java') && targetMinecraft != '1.21.11') {
        text = text.replaceAll(/(?m)^import (?:com\.mojang\.blaze3d\.vertex|net\.minecraft\.client\.render|net\.minecraft\.client\.util\.BufferAllocator)\.[^;]+;\n/, '')
                .replace('import net.minecraft.client.util.BufferAllocator;\n', '')
        int benchmark = text.indexOf('    private static String emitBenchmark(')
        if (benchmark >= 0) text = text.substring(0, benchmark) + '    private static String emitBenchmark(Miniature.Level level) { return "not measured"; }\n}\n'
    }
    if (path.endsWith('/CompatibilitySmoke.java') && !before('1.21.9')) text = text.replace('button.onPress();', 'button.onPress(null);')
    if (unobfuscated) {
        if (path.endsWith('/CompatibilitySmoke.java')) {
            text = text.replace('net.minecraft.client.MinecraftClient', 'net.minecraft.client.Minecraft')
                    .replace('MinecraftClient', 'Minecraft')
                    .replace('net.minecraft.client.gui.widget.ButtonWidget', 'net.minecraft.client.gui.components.Button')
                    .replace('ButtonWidget', 'Button')
                    .replace('net.minecraft.text.Text', 'net.minecraft.network.chat.Component')
                    .replace('Text.translatable(', 'Component.translatable(')
                    .replace('client.currentScreen', 'client.screen')
                    .replace('net.minecraft.client.util.ScreenshotRecorder', 'net.minecraft.client.Screenshot')
                    .replace('ScreenshotRecorder.saveScreenshot(', 'Screenshot.grab(')
                    .replace('client.getFramebuffer()', 'client.getMainRenderTarget()')
                    .replace('client.scheduleStop()', 'client.stop()')
            if (!targetMinecraft.startsWith('26.1')) text = text.replace('client.getOverlay()', 'client.gui.overlay()')
            if (!targetMinecraft.startsWith('26.1')) text = text.replace('Screenshot.grab(Path.of(".").toFile(), client.getMainRenderTarget(), message -> {});', 'Screenshot.grab(client, false);')
        }
        text = text.replace('net.minecraft.client.gui.GuiGraphics;', 'net.minecraft.client.gui.GuiGraphicsExtractor;')
                .replace('ClientCommandManager.', 'ClientCommands.')
                .replace('import org.lwjgl.glfw.GLFW;', '')
                .replace('InputConstants.Type.KEYSYM', 'InputConstants.Type.KEYBOARD')
                .replace('GLFW.GLFW_KEY_UNKNOWN', 'InputConstants.UNKNOWN.getValue()')
                .replace('client.screen', 'client.gui.screen()').replace('minecraft.screen', 'minecraft.gui.screen()')
                .replace('client.setScreen(', 'client.gui.setScreen(').replace('minecraft.setScreen(', 'minecraft.gui.setScreen(')
                .replace('Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen(')
                .replace('client.player.displayClientMessage(', 'client.player.sendSystemMessage(')
                .replace('.append(text), false);', '.append(text));')
                .replace('client.gameRenderer.getMainCamera()', 'client.gameRenderer.mainCamera()')
                .replace('matrices.mulPose(', 'matrices.rotate(')
                .replace('layer.setTransform(transform)', 'layer.setItemTransform(transform)')
                .replace('Util.getPlatform().openPath(dir)', 'dev.yimeng.schematictotem.compat.PlatformBridge.openPath(dir)')
                .replace('GuiGraphics context', 'GuiGraphicsExtractor context')
                .replace('net.minecraft.client.renderer.LightTexture;', 'net.minecraft.util.LightCoordsUtil;')
                .replace('LightTexture.', 'LightCoordsUtil.')
