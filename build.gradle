plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.13' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.13' apply false
}

def versionMatrix = new groovy.json.JsonSlurper().parse(file("versioning/versions.json"))
ext.targetMinecraft = (findProperty("mc") ?: project.minecraft_version).toString()
if (!versionMatrix.containsKey(targetMinecraft)) throw new GradleException("Unsupported Minecraft target: ${targetMinecraft}; choose ${versionMatrix.keySet()}")
ext.targetConfig = versionMatrix[targetMinecraft]
ext.unobfuscated = targetMinecraft.startsWith("26.")
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
layout.buildDirectory = file("build/versions/${targetMinecraft}")
version = "${project.mod_version}+mc${targetMinecraft}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    if (!unobfuscated) mappings "net.fabricmc:yarn:${targetConfig.yarn}:v2"
    add(unobfuscated ? "implementation" : "modImplementation", "net.fabricmc:fabric-loader:${targetConfig.loader}")
    add(unobfuscated ? "implementation" : "modImplementation", "net.fabricmc.fabric-api:fabric-api:${targetConfig.fabric_api}")

    // Mod Menu is optional at runtime; its API is only needed to compile the config-button entrypoint.
    add(unobfuscated ? "compileOnly" : "modCompileOnly", files(targetConfig.modmenu.file))

    compileOnly "org.jspecify:jspecify:1.0.0"
    testCompileOnly "org.jspecify:jspecify:1.0.0"
    testImplementation "net.fabricmc:fabric-loader-junit:${targetConfig.loader}"
}

// -PwithMods=<jar>[;<jar>...]: other mods in the dev client / client game test, e.g. Punchy for the first-person checks.
// They are copied to ASCII names first: Loom does not pick up jars named like 【第一人称动画】punchy.jar.
def extraMods = (project.findProperty("withMods") ?: "").toString().split(";").findAll { !it.isBlank() }
if (!extraMods.isEmpty()) {
    def extraDir = layout.buildDirectory.dir("extra-mods").get().asFile
    extraDir.mkdirs()
    def copies = extraMods.collect { path ->
        def source = file(path.trim())
        def target = new File(extraDir, source.name.replaceAll("[^A-Za-z0-9._+-]", ""))
        java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        target
    }
    dependencies {
        add(unobfuscated ? "runtimeOnly" : "modLocalRuntime", files(copies))
    }
}

// Offline checks against real schematic files (no game window): -Pschematics=<dir> overrides the folder.
test {
    useJUnitPlatform()
    maxHeapSize = "4G"
    systemProperty "schematictotem.testDir", project.findProperty("schematics")
            ?: file("src/test/resources/fixtures").absolutePath
    systemProperty "schematictotem.reportDir", layout.buildDirectory.dir("reports/schematictotem").get().asFile.absolutePath
    systemProperty "schematictotem.debugReader", project.findProperty("debugReader") ?: "false"
    testLogging {
        showStandardStreams = true
        exceptionFormat = "full"
    }
}

apply from: "versioning/prepare.gradle"

if (project.hasProperty("smoke")) apply from: "versioning/smoke.gradle"

loom {
    if (targetMinecraft == "1.21.11") accessWidenerPath = file("src/main/resources/schematictotem.accesswidener")
    // gradlew runClientGameTest [-Psweep=true] [-Pfront=east] [-PtestFile=<schematic>] [-PwithMods=<jar>]
    runs.matching { it.name == "clientGameTest" }.configureEach {
        vmArg "-Dschematictotem.test.sweep=" + (project.findProperty("sweep") ?: "false")
        vmArg "-Dschematictotem.test.front=" + (project.findProperty("front") ?: "")
        if (project.findProperty("testFile")) vmArg "-Dschematictotem.test.file=" + file(project.findProperty("testFile")).absolutePath
        if (project.findProperty("bigTestFile")) vmArg "-Dschematictotem.test.big=" + file(project.findProperty("bigTestFile")).absolutePath
        // -PmodPoses="rx,ry,rz,tx,ty,tz,scale;...": screenshots of first-person poses for mods like Punchy
        if (project.findProperty("modPoses")) {
            vmArg "-Dschematictotem.test.modSweep=true"
            vmArg "-Dschematictotem.test.modPoses=" + project.findProperty("modPoses")
        }
        programArgs "--width", "1280", "--height", "720"
    }
}

if (targetMinecraft == "1.21.11") fabricApi {
    configureTests {
        createSourceSet = true
        modId = "schematictotem-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft": targetMinecraft, "java": targetConfig.java,
                "loader": targetConfig.loader, "fabricApi": targetConfig.fabric_api
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = targetConfig.java as int
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << "-Xlint:deprecation"
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetConfig.java)
    targetCompatibility = JavaVersion.toVersion(targetConfig.java)
    toolchain.languageVersion = JavaLanguageVersion.of(unobfuscated ? 25 : 21)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// gradlew sourceRelease -> build/distributions/schematic-totem-<version>-src.zip, a source tree that builds on its own.
// Listed file by file, so research/ (decompiled game and third-party code), run/, logs and build output never get in;
// gradle.properties loses this machine's org.gradle.java.home.
tasks.register("sourceRelease", Zip) {
    group = "distribution"
    description = "Packs the buildable source tree into build/distributions."
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    def root = "${project.archives_base_name}-${project.mod_version}-multiversion-src"
    archiveFileName = "${root}.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")
    from(projectDir) {
        include "src/**", "libs/modmenu/*.jar", "libs/modmenu/*.LICENSE.txt", "libs/README.md",
                "gradle/wrapper/**", "gradlew", "gradlew.bat", "build.gradle", "settings.gradle",
                "README.md", "CHANGELOG.md", "LICENSE", "versioning/*.gradle", "versioning/versions.json", "ports/**", "docs/**", "scripts/**"
        into root
    }
    // Ant's default excludes also hide Git metadata files requested explicitly.
    [".gitignore", ".gitattributes"].each { name ->
        from(resources.text.fromString(file(name).getText("UTF-8")).asFile()) {
            rename { name }
            into root
        }
    }
    from(projectDir) {
        include "gradle.properties"
        filteringCharset = "UTF-8"
        filter { String line ->
            def trimmed = line.trim()
            trimmed.isEmpty() || trimmed.startsWith('#') || trimmed ==~ /(?:org.gradle.jvmargs|org.gradle.parallel|minecraft_version|mod_version|maven_group|archives_base_name)=.*/ ? line : null
        }
        filter(org.apache.tools.ant.filters.FixCrLfFilter,
                eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance("lf"))
        into root
    }
    // gradlew keeps its executable bit for unzip on Linux / macOS
    filesMatching("**/gradlew") { permissions { unix("rwxr-xr-x") } }
}
